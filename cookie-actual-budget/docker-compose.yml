version: "3.7"

services:
  actual_server:
    image: actualbudget/actual-server:latest
    container_name: actual_budget
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "${APP_COOKIE_ACTUAL_BUDGET_PORT:-5006}:5006"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - NODE_ENV=production
