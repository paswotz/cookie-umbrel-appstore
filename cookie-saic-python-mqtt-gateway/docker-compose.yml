version: "3.7"

services:
  saic-mqtt-gateway:
    image: saicismartapi/saic-python-mqtt-gateway:latest
    restart: unless-stopped
    environment:
      - MQTT_URI=mqtt://umbrel-mosquitto:1883
      - SAIC_USER=max.mustermann@gmail.com
      - SAIC_PASSWORD=max.mustermann123
      - CHARGING_STATIONS_JSON=/config/charging-stations.json
    volumes:
      - ${APP_DATA_DIR}:/config
